[project]
name = "beauty-ops-copilot"
version = "0.1.0"
description = "Enterprise dual-agent retail platform with Google ADK 2.13, Vertex AI Gemini, and MCP."
requires-python = ">=3.12"
dependencies = [
    "google-adk[eval,otel]==2.13.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-pubsub>=2.43.0",
    "mcp[cli]==2.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-resourcedetector-gcp",  # Cloud Run service/revision/region on spans (D2.3)
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
