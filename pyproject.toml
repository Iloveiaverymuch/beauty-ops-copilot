[project]
name = "beauty-ops-copilot"
version = "0.1.0"
description = "ADK + Vertex AI + MCP agent POC (L'Oréal mission prep)"
requires-python = ">=3.12"
dependencies = [
    "google-adk[eval]==2.13.0",
    "mcp[cli]==2.3.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
