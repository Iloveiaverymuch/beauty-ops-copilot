name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_evals:
        description: Run live evaluations against Vertex AI / GCP
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEMETRY: 'off'
      SESSIONS: memory
      CLAIMS_BUS: local
      CLAIMS_TRIAGE: rule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Python regression & evaluator tests
        run: |
          mkdir -p reports
          uv run --no-sync pytest -q --junitxml=reports/pytest.xml
      - name: ADK offline evaluation suite (behavioral gate)
        run: |
          uv run --no-sync python -m evals.adk.run_adk_eval --offline --detailed --output reports/adk-eval-offline.json
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-test-reports
          path: reports/
          retention-days: 7

  live-evaluation:
    name: Live ADK & Vertex AI evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_evals
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: 'rk-adk-poc-1104'
      GOOGLE_CLOUD_LOCATION: 'eu'
      EMBED_LOCATION: 'europe-west1'
      MODEL: 'gemini-3.8-flash'
      GOOGLE_GENAI_USE_VERTEXAI: 'TRUE'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Run live ADK evaluation suite
        run: |
          mkdir -p reports
          uv run --no-sync python -m evals.adk.run_adk_eval --live --output reports/adk-eval-live.json
      - name: Run Vertex AI LLM-as-a-judge benchmarking
        if: always()
        run: |
          uv run --no-sync python -m evals.vertex.run_vertex_eval --report reports/adk-eval-live.json
      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-evaluation-report
          path: reports/
          retention-days: 7
