services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-ops-postgres
    environment:
      POSTGRES_USER: adk
      POSTGRES_PASSWORD: adk
      POSTGRES_DB: adk_sessions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adk -d adk_sessions"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg_sessions_data:/var/lib/postgresql/data

volumes:
  pg_sessions_data:
